default_config:
homeassistant:
  customize: !include customize.yaml

frontend:
  themes: !include_dir_merge_named themes

scene: !include scenes.yaml
automation: !include automations.yaml
script: !include scripts.yaml
sensor: !include sensors.yaml
rest_command: !include rest_command.yaml
yahoofinance: !include yahoofinance.yaml
device_tracker:
  - platform: bluetooth_le_tracker
    track_new_devices: false

logger:
  logs:
    custom_components.pitboss: debug
    pytboss: info
  filters:
    custom_components.audiconnect.audi_connect_account:
      - ".*: 403, .*"
      - ".*status=403.*"
      - ".*SSLCertVerificationError.*"
    custom_components.pitboss:
      - ".*Manually updated pitboss data.*"
# influxdb:
#   host: a0d7b954-influxdb
#   port: 8086
#   database: homeassistant
#   username: homeassistant
#   password: !secret influxdb_password
#   max_retries: 3
#   default_measurement: state

input_select:
  # Both ThermoPro probes expose the same four temperature sensors.
  # No `initial:` on these helpers — setting it overrides restore_state, which
  # would reset your selection on every restart, including mid-cook.
  meat_probe_white_sensor:
    name: White Probe Sensor
    options:
      - Internal Tip
      - Internal Center
      - Internal End
      - Ambient
  meat_probe_black_sensor:
    name: Black Probe Sensor
    options:
      - Internal Tip
      - Internal Center
      - Internal End
      - Ambient

input_boolean:
  # Cancel flags for script.monitor_meat_probe. Turning one off lets that
  # probe's monitoring loop exit cleanly so it can still end its Live Activity.
  meat_probe_white_monitoring:
    name: White Probe Monitoring
    icon: mdi:thermometer-check
  meat_probe_black_monitoring:
    name: Black Probe Monitoring
    icon: mdi:thermometer-check

input_number:
  # Likewise no `initial:` — the last target you set should survive a restart.
  meat_probe_white_target_temp:
    name: White Probe Target Temp
    min: 100
    max: 250
    step: 1
    unit_of_measurement: "°F"
    mode: box
  meat_probe_black_target_temp:
    name: Black Probe Target Temp
    min: 100
    max: 250
    step: 1
    unit_of_measurement: "°F"
    mode: box

zha:
  enable_quirks: true
  custom_quirks_path: /config/zha_quirks/

zha_toolkit:
