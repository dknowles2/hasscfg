perform_action_when_entity_becomes_available:
  alias: Perform action when entity becomes available
  sequence:
  - if:
    - condition: template
      value_template: '{{ utcnow() - states[repeat.item].last_updated > cooldown }}'
    then: []
    enabled: false
  - wait_template: '{{ not is_state(entity_id, "unavailable") }}'
    continue_on_timeout: false
    timeout: 01:00:00
  - action: '{{ action }}'
    target:
      entity_id: '{{ entity_id }}'
  - action: notify.mobile_app_davids_iphone_17_pro
    data: {}
  fields:
    entity_id:
      selector:
        entity: {}
      name: Entity ID
      required: true
    action:
      selector:
        action: {}
      name: Action
    cooldown:
      selector:
        duration: {}
      name: Cooldown
      default:
        hours: 1
        minutes: 0
        seconds: 0
  description: ''
  mode: parallel
  max: 10
set_shade_position:
  alias: Set shade position
  sequence:
  - if:
    - condition: template
      value_template: '{{ is_state(entity_id, ''unavailable'') }}'
      alias: If shade is unavailable
    then:
    - wait_template: '{{ not is_state(entity_id, ''unavailable'') }}'
      continue_on_timeout: false
      timeout: 01:00:00
  - action: cover.set_cover_position
    target:
      entity_id: '{{ entity_id }}'
    data:
      position: '{{ position }}'
  fields:
    entity_id:
      selector:
        entity: {}
      name: Entity
      required: true
    position:
      selector:
        number:
          min: 0
          max: 100
      name: Position
  description: ''
  mode: parallel
  max: 30
monitor_meat_probe:
  alias: Monitor Meat Probe
  description: Monitors a ThermoPro probe and notifies when target temperature is
    reached
  mode: parallel
  max: 2
  fields:
    probe:
      name: Probe
      required: true
    sensor:
      name: Sensor
      required: true
      default: Internal Tip
    target_temp:
      name: Target Temperature (°F)
      required: true
      selector:
        number:
          min: 100
          max: 250
          unit_of_measurement: °F
    timeout_hours:
      name: Timeout (hours)
      description: Give up after this long so a stalled cook cannot run forever.
      required: false
      default: 12
      selector:
        number:
          min: 1
          max: 24
    dropout_seconds:
      name: Dropout tolerance (seconds)
      description: How long the probe may stay unavailable before monitoring aborts.
      required: false
      default: 600
      selector:
        number:
          min: 60
          max: 3600
  sequence:
  - variables:
      probe_key: '{{ probe | lower | trim }}'
      entity_id: sensor.thermopro_{{ probe | lower | trim }}_probe_{{ sensor | lower
        | trim | replace(' ', '_') }}_temperature
      cancel_flag: input_boolean.meat_probe_{{ probe | lower | trim }}_monitoring
      activity_id: meat_probe_{{ probe | lower | trim }}
      target_f: '{{ target_temp | float(0) }}'
      deadline: '{{ now().timestamp() + (timeout_hours | default(12) | float(12) *
        3600) }}'
      dropout_limit: '{{ dropout_seconds | default(600) | float(600) }}'
  - if:
    - condition: template
      value_template: '{{ states(entity_id) in [''unknown'', ''unavailable''] }}'
    then:
    - action: notify.mobile_app_davids_iphone_17_pro
      data:
        message: Can't find sensor {{ entity_id }} — check probe/sensor selection.
    - stop: Entity unavailable
  - action: input_boolean.turn_on
    target:
      entity_id: '{{ cancel_flag }}'
  # Home Assistant drives Live Activities off `tag` + `live_update`, resolving a
  # stored APNs token per tag. The older live_activity_update_type/activity_id/
  # content_state keys are not read by mobile_app at all, which is why no
  # activity ever appeared.
  - action: notify.mobile_app_davids_iphone_17_pro
    data:
      title: '{{ probe }} Probe'
      message: '{{ states(entity_id) | float(0) | round(1) }}°F → {{ target_temp }}°F
        ({{ sensor }})'
      data:
        tag: '{{ activity_id }}'
        live_update: true
        notification_icon: mdi:thermometer
        progress: '{{ states(entity_id) | float(0) | round(0) | int }}'
        progress_max: '{{ target_f | float(0) | round(0) | int }}'
  - repeat:
      while:
      # Stop button (or any turn_off of the flag) ends the loop cleanly.
      - condition: template
        value_template: '{{ is_state(cancel_flag, ''on'') }}'
      - condition: template
        value_template: '{{ states(entity_id) | float(0) < target_f | float(0) }}'
      # Overall timeout so a stalled cook cannot hold a parallel slot forever.
      - condition: template
        value_template: '{{ now().timestamp() < deadline | float(0) }}'
      # Tolerate brief BLE dropouts, but give up on a sustained one.
      - condition: template
        value_template: "{% set st = states[entity_id] %}\n{{ states(entity_id) not
          in ['unknown', 'unavailable']\n   or (st is not none\n       and (now() -
          st.last_changed).total_seconds() < dropout_limit | float(600)) }}\n"
      sequence:
      # Wakes immediately on stop or on hitting target; otherwise ticks every 60s
      # to refresh the Live Activity.
      - wait_template: "{{ is_state(cancel_flag, 'off')\n   or states(entity_id) |
          float(0) >= target_f | float(0) }}\n"
        timeout: '00:01:00'
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: "{{ is_state(cancel_flag, 'on')\n   and states(entity_id)
            | float(0) < target_f | float(0) }}\n"
        then:
        - action: notify.mobile_app_davids_iphone_17_pro
          data:
            title: '{{ probe }} Probe'
            message: '{{ states(entity_id) | float(0) | round(1) }}°F → {{ target_temp
              }}°F ({{ sensor }})'
            data:
              tag: '{{ activity_id }}'
              live_update: true
              notification_icon: mdi:thermometer
              progress: '{{ states(entity_id) | float(0) | round(0) | int }}'
              progress_max: '{{ target_f | float(0) | round(0) | int }}'
              # Refreshes must not re-alert once a minute.
              silent: true
  # Every exit path ends the Live Activity, so none are left orphaned on the phone.
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ states(entity_id) | float(0) >= target_f | float(0) }}'
      sequence:
      # Alert on its own tag so it is not swallowed by the Live Activity.
      - action: notify.mobile_app_davids_iphone_17_pro
        data:
          title: Meat is ready!
          message: '{{ probe }} Probe hit {{ target_temp }}°F'
          data:
            tag: '{{ activity_id }}_done'
            push:
              interruption-level: critical
              sound:
                name: default
                critical: 1
                volume: 1
      # clear_notification on the activity tag is what HA turns into the
      # ActivityKit "end" event, and it drops the stored token.
      - action: notify.mobile_app_davids_iphone_17_pro
        data:
          message: clear_notification
          data:
            tag: '{{ activity_id }}'
    default:
    - variables:
        reason: "{% if is_state(cancel_flag, 'off') %}stopped\n{% elif now().timestamp()
          >= deadline | float(0) %}timed out after {{ timeout_hours | default(12) }}h\n{%
          else %}aborted — probe offline\n{% endif %}\n"
    - action: notify.mobile_app_davids_iphone_17_pro
      data:
        title: Monitoring ended
        message: '{{ probe }} Probe monitoring {{ reason | trim }}.'
        data:
          tag: '{{ activity_id }}_done'
    - action: notify.mobile_app_davids_iphone_17_pro
      data:
        message: clear_notification
        data:
          tag: '{{ activity_id }}'
  - action: input_boolean.turn_off
    target:
      entity_id: '{{ cancel_flag }}'
start_white_probe_monitoring:
  alias: Start White Probe Monitoring
  sequence:
  # script.turn_on does not wait for completion, so this wrapper returns
  # immediately instead of staying "running" for the whole cook.
  - action: script.turn_on
    target:
      entity_id: script.monitor_meat_probe
    data:
      variables:
        probe: White
        sensor: '{{ states(''input_select.meat_probe_white_sensor'') }}'
        target_temp: '{{ states(''input_number.meat_probe_white_target_temp'') | int
          }}'
  mode: single
start_black_probe_monitoring:
  alias: Start Black Probe Monitoring
  sequence:
  - action: script.turn_on
    target:
      entity_id: script.monitor_meat_probe
    data:
      variables:
        probe: Black
        sensor: '{{ states(''input_select.meat_probe_black_sensor'') }}'
        target_temp: '{{ states(''input_number.meat_probe_black_target_temp'') | int
          }}'
  mode: single
get_mne_transit_alerts:
  alias: Get MNE Transit Alerts
  description: Fetches NJ Transit system status and returns only alerts for the MNE
    (Morristown Line) abbreviation
  sequence:
  - action: rest_command.transit_alerts
    response_variable: transit_response
  - variables:
      mne_alerts: "{{ transit_response.content.data.getSystemStatus\n   | selectattr('abbreviation',
        'eq', 'MNE')\n   | list }}"
  - stop: ''
    response_variable: mne_alerts
  mode: single
acknowledge_flash:
  alias: Acknowledge flash
  description: >-
    Briefly fades a light to a colour and back, as visual confirmation that an
    automation ran. The light is snapshotted first and restored afterwards, so
    this is safe to call on a light that is in use -- including one that is
    off, which flashes and then goes dark again.
  sequence:
  - variables:
      # Not fully saturated: a pure 0,255,0 reads as a harsh lime on most
      # bulbs, and the point here is to be noticed, not to hurt.
      palette:
        green:
        - 0
        - 220
        - 60
        red:
        - 255
        - 40
        - 0
        amber:
        - 255
        - 150
        - 0
        blue:
        - 0
        - 120
        - 255
      rgb: '{{ palette[color | default(''green'', true)] }}'
      # Keyed on the light so two different lights can flash at once without
      # trampling each other's snapshot.
      scene_id: ack_flash_{{ entity_id | replace('.', '_') }}
      al_switch: '{{ adaptive_lighting_switch | default('''', true) }}'
  - action: scene.create
    data:
      scene_id: '{{ scene_id }}'
      snapshot_entities: '{{ [entity_id] }}'
  # Adaptive Lighting treats an outside colour change as the user taking over
  # and would either fight the flash or leave the light stranded in manual
  # mode. Claiming and releasing control explicitly avoids both.
  - if:
    - condition: template
      value_template: '{{ al_switch != '''' }}'
    then:
    - action: adaptive_lighting.set_manual_control
      data:
        entity_id: '{{ al_switch }}'
        lights: '{{ [entity_id] }}'
        manual_control: true
  - action: light.turn_on
    target:
      entity_id: '{{ entity_id }}'
    data:
      rgb_color: '{{ rgb }}'
      brightness_pct: '{{ brightness_pct | default(100, true) | int }}'
      transition: '{{ transition | default(0.3, true) | float }}'
  - delay:
      seconds: '{{ hold | default(1, true) | float }}'
  - action: scene.turn_on
    target:
      entity_id: scene.{{ scene_id }}
    data:
      transition: '{{ transition | default(0.3, true) | float }}'
  # The scene is transient and would vanish on restart anyway, but leaving it
  # behind means a stray scene entity per light forever.
  - action: scene.delete
    target:
      entity_id: scene.{{ scene_id }}
  - if:
    - condition: template
      value_template: '{{ al_switch != '''' }}'
    then:
    - delay:
        seconds: '{{ transition | default(0.3, true) | float }}'
    - action: adaptive_lighting.set_manual_control
      data:
        entity_id: '{{ al_switch }}'
        lights: '{{ [entity_id] }}'
        manual_control: false
  fields:
    entity_id:
      name: Light
      required: true
      selector:
        entity:
          domain: light
    color:
      name: Colour
      default: green
      selector:
        select:
          options:
          - green
          - red
          - amber
          - blue
    hold:
      name: Hold
      description: Seconds to stay on the colour before fading back.
      default: 1
      selector:
        number:
          min: 0.2
          max: 10
          step: 0.1
          unit_of_measurement: s
    transition:
      name: Fade
      description: Seconds for each fade, in and out.
      default: 0.3
      selector:
        number:
          min: 0
          max: 5
          step: 0.1
          unit_of_measurement: s
    brightness_pct:
      name: Brightness
      default: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: '%'
    adaptive_lighting_switch:
      name: Adaptive Lighting switch
      description: >-
        Optional. If this light is managed by Adaptive Lighting, pass its
        switch so control is claimed and released cleanly around the flash.
      default: ''
      selector:
        entity:
          integration: adaptive_lighting
          domain: switch
  # Queued rather than parallel: two acknowledgements landing on the same light
  # at once would have the second snapshot capture the first one's colour and
  # restore to that.
  mode: queued
  max: 10
