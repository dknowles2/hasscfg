blueprint:
  name: Battery Health Alert
  description: >-
    Watches every battery entity in Home Assistant and reports two distinct
    failure modes: a battery that has dropped below a threshold, and a battery
    device that has stopped reporting altogether.

    The second case is the one that bites. A battery sensor that goes silent
    keeps showing its last value, or shows nothing at all, which looks
    identical to "everything is fine" — so a dead sensor is invisible until you
    need it.

    Entities are discovered automatically: anything in the `sensor` or
    `binary_sensor` domain carrying `device_class: battery`. New battery
    devices are picked up with no edit here. Configure what to *ignore*
    instead — phones, tablets and cooking probes are the usual candidates,
    since their batteries are managed by hand and their sensors drop offline
    routinely.

    Because the entity set is not known until the automation runs, this
    cannot use per-entity state triggers — those need their entities at setup
    time. It scans on a schedule instead. That suits batteries, which move
    slowly, and it avoids the class of bug where a disabled entity leaves a
    trigger pointing at something that no longer exists.

    Raises one Home Assistant repair issue per affected *device* (via Spook's
    `repairs.create`), with a link straight to that device's settings page, and
    sends a single non-critical summary notification. Repair issues are
    withdrawn automatically once every battery on the device recovers.

    A disabled or deleted entity simply stops being discovered, so it stops
    being alerted on. That is the intended way to retire a battery sensor.
  domain: automation
  source_url: https://github.com/dknowles2/hasscfg
  input:
    monitoring:
      name: What to monitor
      icon: mdi:battery-alert
      input:
        exclude_entities:
          name: Excluded entities
          description: >-
            Battery entities to leave alone. Everything else with
            `device_class: battery` is monitored automatically.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
                  device_class: battery
                - domain: binary_sensor
                  device_class: battery
    thresholds:
      name: When to complain
      icon: mdi:tune
      input:
        threshold:
          name: Low battery threshold
          description: Percentage at or below which a battery counts as low.
          default: 20
          selector:
            number:
              min: 1
              max: 90
              unit_of_measurement: "%"
        unavailable_grace:
          name: Not-reporting grace period
          description: >-
            How long a battery entity must have been unavailable or unknown
            before it is treated as a fault. Keeps brief dropouts and restarts
            quiet. Measured from the entity's last state change, so a restart
            resets the clock.
          default:
            hours: 6
            minutes: 0
            seconds: 0
          selector:
            duration:
        scan_interval:
          name: Scan interval
          description: >-
            How often to sweep every battery entity. Batteries move slowly;
            frequent scanning buys nothing.
          default: "/30"
          selector:
            select:
              options:
                - label: Every 5 minutes
                  value: "/5"
                - label: Every 10 minutes
                  value: "/10"
                - label: Every 15 minutes
                  value: "/15"
                - label: Every 30 minutes
                  value: "/30"
        daily_check:
          name: Daily re-check
          description: >-
            A guaranteed sweep at a fixed time, independent of the interval
            above.
          default: "09:00:00"
          selector:
            time:
    reporting:
      name: How to report
      icon: mdi:bell-outline
      input:
        notify_action:
          name: Notify action
          description: >-
            The notify action to call, for example
            notify.mobile_app_your_phone. Leave blank to skip notifications and
            only raise repair issues.
          default: ""
          selector:
            text:
        notification_url:
          name: Notification tap target
          description: >-
            Where tapping the summary notification lands. A push notification
            has a single tap target, so this cannot deep-link to one device
            when several are affected — point it at a page that lists them.
            The repair issues themselves link to each device individually.
          default: /config/repairs
          selector:
            text:
        repair_domain:
          name: Repair issue logo
          description: >-
            Which integration logo the repair issue shows. "homeassistant" is a
            safe default.
          default: homeassistant
          selector:
            text:
        severity:
          name: Repair severity
          default: warning
          selector:
            select:
              options:
                - warning
                - error
                - critical

mode: single
max_exceeded: silent

triggers:
  - trigger: time_pattern
    minutes: !input scan_interval
    id: sweep
  - trigger: time
    at: !input daily_check
    id: sweep
  - trigger: homeassistant
    event: start
    id: startup

conditions: []

actions:
  # Entities are still settling immediately after a restart; evaluating now
  # would flag half the house as not reporting.
  - if:
      - condition: trigger
        id: startup
    then:
      - delay:
          minutes: 10

  - variables:
      excluded: !input exclude_entities
      low_threshold: !input threshold
      grace: !input unavailable_grace
      notify_action: !input notify_action
      notification_url: !input notification_url
      repair_domain: !input repair_domain
      repair_severity: !input severity

  - variables:
      grace_seconds: >-
        {{ (grace.hours | default(0) | int) * 3600
           + (grace.minutes | default(0) | int) * 60
           + (grace.seconds | default(0) | int) }}
      # Discovery. Iterating every state is expensive, which is exactly why
      # this runs on a schedule rather than inside a template trigger — a
      # template trigger over `states` re-renders on every state change in the
      # system. Note that an entity which is present but unavailable keeps its
      # device_class, so the not-reporting case is still discovered; only
      # entities absent from the state machine (disabled, deleted) drop out,
      # which is the intent.
      monitored: >-
        {% set ns = namespace(items=[]) %}
        {% for st in states.sensor %}
          {% if st.attributes.device_class | default('') == 'battery' %}
            {% set ns.items = ns.items + [st.entity_id] %}
          {% endif %}
        {% endfor %}
        {% for st in states.binary_sensor %}
          {% if st.attributes.device_class | default('') == 'battery' %}
            {% set ns.items = ns.items + [st.entity_id] %}
          {% endif %}
        {% endfor %}
        {{ ns.items | reject('in', excluded) | sort | list }}

  - variables:
      # Each faulty entity carries its device so the next block can group by
      # it. Entities with no device fall back to keying on themselves.
      faulty: >-
        {% set ns = namespace(items=[]) %}
        {% for e in monitored %}
          {% set st = states[e] %}
          {% if st is not none %}
            {% set s = st.state %}
            {% set numeric = e.split('.')[0] == 'sensor' %}
            {% set reason = none %}
            {% set detail = none %}
            {% if s in ['unknown', 'unavailable'] %}
              {% if (now() - st.last_changed).total_seconds() >= grace_seconds | int %}
                {% set reason = 'not reporting' %}
                {% set detail = s %}
              {% endif %}
            {% elif numeric and s | float(101) <= low_threshold | float(20) %}
              {% set reason = 'low' %}
              {% set detail = s ~ '%' %}
            {% elif not numeric and s == 'on' %}
              {% set reason = 'low' %}
              {% set detail = 'reported low' %}
            {% endif %}
            {% if reason is not none %}
              {% set dev = device_id(e) %}
              {% set ns.items = ns.items + [{
                   'entity': e,
                   'reason': reason,
                   'detail': detail,
                   'device': dev,
                   'key': dev if dev else e,
                   'name': (device_attr(e, 'name_by_user') or device_attr(e, 'name')
                            or state_attr(e, 'friendly_name') or e) }] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.items }}

  - variables:
      # One group per device, not per entity. A device with two battery
      # entities (a percentage and a low-battery flag, say) is one problem to
      # fix and should be one issue and one line in the notification.
      groups: >-
        {% set ns = namespace(out=[]) %}
        {% for k in faulty | map(attribute='key') | unique | list %}
          {% set members = faulty | selectattr('key', 'eq', k) | list %}
          {% set ns.out = ns.out + [{
               'key': k,
               'device': members[0].device,
               'name': members[0].name,
               'reasons': members | map(attribute='reason') | unique | list,
               'members': members }] %}
        {% endfor %}
        {{ ns.out }}
      # Spans the excluded entities too. Excluding something that currently
      # has an open issue has to withdraw that issue, or it would be stranded
      # with nothing left to clear it.
      all_keys: >-
        {% set ns = namespace(k=[]) %}
        {% for e in monitored + excluded %}
          {% set dev = device_id(e) %}
          {% set ns.k = ns.k + [dev if dev else e] %}
        {% endfor %}
        {{ ns.k | unique | list }}

  - variables:
      healthy_keys: >-
        {{ all_keys | reject('in', groups | map(attribute='key') | list) | list }}

  # One issue per device. The issue_id is derived from the device, which makes
  # create idempotent across runs.
  - repeat:
      for_each: "{{ groups }}"
      sequence:
        - action: repairs.create
          data:
            issue_id: "battery_{{ repeat.item.key }}"
            title: >-
              {{ repeat.item.name }} — battery
              {{ repeat.item.reasons | join(' and ') }}
            description: >-
              {% for m in repeat.item.members -%}
              - `{{ m.entity }}` — **{{ m.reason }}** ({{ m.detail }})
              {% endfor %}

              {% if repeat.item.device -%}
              [Open {{ repeat.item.name }} in device settings](/config/devices/device/{{ repeat.item.device }})
              {%- endif %}

              {% if 'not reporting' in repeat.item.reasons -%}
              A battery entity here has stopped sending updates. A device that
              goes silent looks the same as one that is simply idle, so this
              will not surface anywhere else. Check or replace the battery.
              {%- else -%}
              Replace the battery soon.
              {%- endif %}

              This issue clears itself once every battery on this device
              reports healthy again. To stop watching it altogether, add its
              entities to this automation's exclusion list.
            domain: "{{ repair_domain }}"
            severity: "{{ repair_severity }}"
            persistent: true

  # Withdraw issues for anything that recovered. Removing an issue that does
  # not exist is a no-op, so this needs no bookkeeping.
  - repeat:
      for_each: "{{ healthy_keys }}"
      sequence:
        - action: repairs.remove
          data:
            issue_id: "battery_{{ repeat.item }}"

  # Cleanup from the previous scheme, which alerted on entities that had been
  # disabled or deleted. Discovery makes that impossible, so the issue can no
  # longer be raised and would otherwise linger forever. Removing an issue
  # that is not there costs nothing.
  - action: repairs.remove
    data:
      issue_id: battery_monitor_missing_entities

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ notify_action != '' and groups | count > 0 }}"
        sequence:
          - action: "{{ notify_action }}"
            data:
              title: >-
                {{ groups | count }}
                {{ 'device' if groups | count == 1 else 'devices' }}
                need attention
              message: >-
                {% for g in groups -%}
                {{ g.name }} — {{ g.reasons | join(' and ') }}
                {% endfor %}
              data:
                # Replaces the previous alert instead of stacking a new one.
                tag: battery_health
                # A push notification has one tap target and this is a summary
                # of N devices, so it lands on a list. The per-device links
                # live in the repair issues.
                url: "{{ notification_url }}"
                push:
                  # Deliberately not critical: batteries are never urgent.
                  interruption-level: active
      - conditions:
          - condition: template
            value_template: "{{ notify_action != '' and groups | count == 0 }}"
        sequence:
          - action: "{{ notify_action }}"
            data:
              message: clear_notification
              data:
                tag: battery_health
