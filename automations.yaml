- id: '1733523145702'
  alias: Lights - Outdoors
  description: 'On from 05:30, or 30 minutes before sunrise when the sun beats that, until
    30 minutes after sunrise; then from 30 minutes before sunset until 23:00 on weeknights
    or 00:30 following a Friday or Saturday night. The sun and clock triggers act on their
    own edge, so there is no drift. The two morning on-triggers cannot collide with the off-edge:
    the earliest sunrise here is 05:24, which puts sunrise+30 no earlier than 05:54. The restart
    trigger re-derives the right state from the sun and the calendar, so a reboot inside a
    window does not strand the lights.'
  triggers:
  - trigger: sun
    event: sunrise
    offset: -00:30:00
    id: 'on'
  - trigger: time
    at: 05:30:00
    id: 'on'
  - trigger: sun
    event: sunset
    offset: -00:30:00
    id: 'on'
  - trigger: sun
    event: sunrise
    offset: 00:30:00
    id: 'off'
  - trigger: time
    at: '23:00:00'
    id: off_weeknight
  - trigger: time
    at: 00:30:00
    id: off_late_night
  - trigger: homeassistant
    event: start
    id: resync
  conditions: []
  actions:
  - variables:
      late_nights:
      - 4
      - 5
      want: "{%- if trigger.id in ['on', 'off'] -%}\n  {{ trigger.id }}\n{%- elif trigger.id\
        \ == 'off_weeknight' -%}\n  {{ 'skip' if now().weekday() in late_nights else 'off'\
        \ }}\n{%- elif trigger.id == 'off_late_night' -%}\n  {{ 'off' if (now().weekday()\
        \ - 1) % 7 in late_nights else 'skip' }}\n{%- else -%}\n  {%- set n = now() -%}\n\
        \  {%- set nr = state_attr('sun.sun', 'next_rising') -%}\n  {%- set ns = state_attr('sun.sun',\
        \ 'next_setting') -%}\n  {%- if nr is none or ns is none -%}\n    skip\n  {%- else\
        \ -%}\n    {#- sun.sun only publishes the *next* event. Before today's\n        sunrise\
        \ that is today's; after it, it is tomorrow's, which is\n        within a couple of\
        \ minutes of today's. Fine for a restart. -#}\n    {%- set nr = nr | as_datetime |\
        \ as_local -%}\n    {%- set ns = ns | as_datetime | as_local -%}\n    {%- set sunrise\
        \ = nr if nr.date() == n.date() else nr - timedelta(days=1) -%}\n    {%- set sunset\
        \ = ns if ns.date() == n.date() else ns - timedelta(days=1) -%}\n    {%- set day0\
        \ = n.replace(hour=0, minute=0, second=0, microsecond=0) -%}\n    {#- 05:30, or sunrise-30\
        \ when the sun is up earlier than that. -#}\n    {%- set morning_on = [day0.replace(hour=5,\
        \ minute=30),\n                          sunrise - timedelta(minutes=30)] | min -%}\n\
        \    {%- set cutoff = (day0 + timedelta(days=1, minutes=30))\n                   \
        \  if n.weekday() in late_nights else day0.replace(hour=23) -%}\n    {%- set tail_end\
        \ = day0.replace(minute=30)\n                       if (n.weekday() - 1) % 7 in late_nights\
        \ else day0 -%}\n    {{ 'on' if (n < tail_end\n                or morning_on <= n\
        \ < (sunrise + timedelta(minutes=30))\n                or (sunset - timedelta(minutes=30))\
        \ <= n < cutoff)\n       else 'off' }}\n  {%- endif -%}\n{%- endif -%}"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ want | trim == ''on'' }}'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.front_porch_lights
      - action: light.turn_on
        target:
          entity_id:
          - light.driveway_lights
          - light.front_porch_light
          - light.front_porch_door_light
    - conditions:
      - condition: template
        value_template: '{{ want | trim == ''off'' }}'
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.driveway_lights
          - light.front_porch_light
          - light.front_porch_door_light
  mode: single
  max_exceeded: silent
- id: '1735483900049'
  alias: Lights - Downstairs Brightness
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - sensor.living_room_esphome_illuminance
  - trigger: state
    entity_id:
    - schedule.downstairs_lights
  conditions: []
  actions:
  - if:
    - condition: or
      conditions:
      - condition: state
        entity_id: schedule.downstairs_lights
        state:
        - 'on'
      - condition: and
        conditions:
        - condition: numeric_state
          entity_id: sensor.living_room_esphome_illuminance
          below: input_number.living_room_lux_lower_bound
    then:
    - alias: Turn on lamps
      action: adaptive_lighting.apply
      metadata: {}
      data:
        lights:
        - light.downstairs_all_lamps
        turn_on_lights: true
        transition: '10'
        adapt_brightness: true
        adapt_color: true
      enabled: true
    - alias: Turn on sconces
      action: adaptive_lighting.apply
      metadata: {}
      data:
        lights:
        - light.downstairs_all_sconces
        turn_on_lights: true
        transition: '10'
        adapt_brightness: true
      enabled: true
    else:
    - if:
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.living_room_esphome_illuminance
          above: input_number.living_room_lux_upper_bound
        - condition: state
          entity_id: schedule.downstairs_lights
          state:
          - 'off'
      then:
      - action: light.turn_off
        metadata: {}
        data:
          transition: 10
        target:
          entity_id:
          - light.downstairs_all_lamps
          - light.downstairs_all_sconces
  - delay:
      hours: 0
      minutes: 5
      seconds: 0
      milliseconds: 0
  trace:
    stored_traces: 200
  mode: single
