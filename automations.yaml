- id: '1786107443390'
  alias: Safety - Close garage door left open after dark
  description: Fail-safe for the garage door being left open overnight. Closes it
    if it has been open for 15 minutes while the sun is down.
  triggers:
  - trigger: state
    entity_id:
    - cover.garage_david_s_garage_door
    to: open
    for:
      hours: 0
      minutes: 15
      seconds: 0
  - trigger: state
    entity_id:
    - sun.sun
    to: below_horizon
  conditions:
  - condition: state
    entity_id: sun.sun
    state: below_horizon
  - condition: state
    entity_id: cover.garage_david_s_garage_door
    state: open
    for:
      hours: 0
      minutes: 15
      seconds: 0
  actions:
  - action: notify.mobile_app_davids_iphone_17_pro
    metadata: {}
    data:
      message: Garage door was open after dark - closing it
  - action: cover.close_cover
    metadata: {}
    target:
      entity_id: cover.garage_david_s_garage_door
    data: {}
  mode: single
